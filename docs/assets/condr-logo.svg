<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">C.O.N.D.R. — Command Operating Node Data Router</title>
  <desc id="desc">A bronze circuit-feather emblem and C.O.N.D.R. wordmark on a dark carbon-inspired background.</desc>
  <defs>
