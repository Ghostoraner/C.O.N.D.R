name: Build kernel

on:
  push:
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ binutils nasm make git python3 \
            xorriso qemu-system-x86

      - name: Build kernel
        run: make kernel

      - name: Build ISO
        run: make iso

      - name: Run QEMU integration test
        run: make test